[project]
name = "comfyui-ragha-preview-video"
description = "Ragha Video Inspector: plays an AI video on the node and checks every frame for flicker, frozen/duplicate frames, glitch frames, black/flash frames, scene cuts and the loop seam, on a clickable QC timeline. Jitter view, A/B compare (slider, side by side, difference, onion skin), and a frame picker that outputs any frame or the last good frame at full resolution for image-to-video continuation. QC report as STRING. Disk-free preview inspired by kijai's Fast Preview."
version = "2.0.0"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/VRH7733/ComfyUI-RaghaPreviewVideo"
Issues = "https://github.com/VRH7733/ComfyUI-RaghaPreviewVideo/issues"

[tool.comfy]
PublisherId = "raghav"
DisplayName = "Ragha Video Inspector"
Icon = "https://raw.githubusercontent.com/VRH7733/ComfyUI-RaghaPreviewVideo/main/assets/icon.png"
