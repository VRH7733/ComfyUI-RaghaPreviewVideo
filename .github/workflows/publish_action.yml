name: Publish to Comfy registry

# Optional. Manual only until you have set up the registry:
# 1. Create a publisher + API key at registry.comfy.org, put the publisher ID in pyproject.toml.
# 2. Add the key as the repo secret REGISTRY_ACCESS_TOKEN.
# 3. Then uncomment the push trigger below to publish automatically when pyproject.toml changes.
on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - "pyproject.toml"

permissions:
  issues: write

jobs:
  publish-node:
    name: Publish custom node to registry
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'VRH7733' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Publish node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
